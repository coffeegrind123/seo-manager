name: SEO auto-merge

# The hands-off publish gate. Without it the pipeline stalls after ONE pull
# request: seo-daily deliberately refuses to build while an `seo` PR is open,
# so if nobody merges, nothing else ever ships.
#
# It merges an open PR labeled `seo` ONLY when BOTH hold:
#
#   1. It is auto-mergeable CONTENT. Every changed file must sit under a path
#      listed in `.seo/publish-paths` (one prefix per line, `#` comments
#      allowed). That file is written at setup time, owned by the repo, and is
#      the whole safety property here: a guide PR that somehow touches
#      src/lib/auth.ts is NOT content and must never merge itself.
#
#   2. Every required check has passed.
#
# TOOL PRs ARE NEVER AUTO-MERGED, whatever the paths say. A tool PR ships
# LLM-authored interactive code that runs in your visitors' browsers; a human
# exercises the widget before it goes live. They are labeled `seo-tool` and
# this workflow skips them by design.
#
# Enable it by setting auto_merge in .seo/config.json:
#     seostate.py config --set auto_merge=true
# With it false (the default) this workflow exits immediately and every PR
# waits for you.

on:
  check_suite:
    types: [completed]
  pull_request_target:
    types: [labeled, synchronize]
  schedule:
    - cron: "41 * * * *"   # hourly backstop: a PR whose checks finished while
                           # the event was dropped still gets picked up
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: seo-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Is auto-merge enabled?
        id: cfg
        run: |
          on=$(python3 -c "import json;print(json.load(open('.seo/config.json')).get('auto_merge') is True)" 2>/dev/null || echo False)
          echo "enabled=$on" >> "$GITHUB_OUTPUT"
          [ "$on" = "True" ] || echo "auto_merge is off - every PR waits for you. This is the default."

      - name: Merge eligible SEO guide PRs
        if: steps.cfg.outputs.enabled == 'True'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f .seo/publish-paths ]; then
            echo "::error::.seo/publish-paths is missing. Auto-merge REFUSES to run without it -"
            echo "::error::without a path allowlist it would merge any file an agent touched."
            exit 1
          fi
          mapfile -t ALLOW < <(grep -vE '^\s*(#|$)' .seo/publish-paths)
          if [ "${#ALLOW[@]}" -eq 0 ]; then
            echo "::error::.seo/publish-paths is empty - refusing to merge anything."
            exit 1
          fi
          printf 'allowed prefixes: %s\n' "${ALLOW[@]}"

          # seo-tool PRs are excluded at the query, not by a later check, so a
          # relabelled PR cannot slip through a race.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --label seo --state open \
                  --json number,labels,files,mergeable,mergeStateStatus \
                  --jq '[.[] | select((.labels|map(.name)|index("seo-tool"))|not)]')

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            n=$(echo "$pr" | jq -r .number)
            echo "--- PR #$n"

            bad=0
            while read -r f; do
              [ -z "$f" ] && continue
              hit=0
              for a in "${ALLOW[@]}"; do
                case "$f" in "$a"*) hit=1; break;; esac
              done
              if [ "$hit" = "0" ]; then
                echo "  outside publish paths: $f"
                bad=1
              fi
            done < <(echo "$pr" | jq -r '.files[].path')

            if [ "$bad" = "1" ]; then
              echo "  NOT auto-mergeable: touches files outside .seo/publish-paths. Leaving for review."
              gh pr comment "$n" --repo "$GITHUB_REPOSITORY" \
                --body "Auto-merge skipped: this PR changes files outside \`.seo/publish-paths\`, so it is not pure content. A human should review it." || true
              continue
            fi

            state=$(echo "$pr" | jq -r .mergeStateStatus)
            case "$state" in
              CLEAN|HAS_HOOKS)
                echo "  checks green - merging"
                gh pr merge "$n" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
                ;;
              BLOCKED|UNSTABLE)
                echo "  checks not green yet ($state) - the hourly backstop will retry"
                ;;
              DIRTY)
                echo "  merge conflict - needs a human"
                ;;
              *)
                echo "  state $state - leaving alone"
                ;;
            esac
          done
